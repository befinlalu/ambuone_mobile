name: ambuone_moblie
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.3
  fluttertoast: ^9.0.0
  get_it: ^9.2.0
  go_router: ^17.0.0
  http: ^1.6.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  permission_handler: ^12.0.1
  pull_to_refresh: ^2.0.0
  shared_preferences: ^2.5.3
  pin_code_fields: ^8.0.1
  step_progress_indicator: ^1.0.2
  flutter_native_contact_picker: ^0.0.11


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
